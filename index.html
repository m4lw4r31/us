<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Te amo &lt;3</title>

    <!-- Microsoft Clarity: estadísticas de visitas -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "z5vbyfl2hu");
    </script>

    <style>
      :root {
        color-scheme: dark;
        --rojo: #e11d2e; /* Cambia este color si quieres otro tono de rojo */
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        background: #000;
      }

      body {
        margin: 0;
        background: transparent;
        color: #f4f4f4;
        font-family: Georgia, "Palatino Linotype", Palatino, "Times New Roman",
          serif;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      /* FONDO: la foto de los dos, borrosa y oscurecida.
         - Menos borroso: baja el 22px (por ejemplo 12px).
         - Más visible: sube el brightness de 0.42 a 0.6. */
      .fondo {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #000;
        background-image: url("./Selina%20y%20jose.webp");
        background-size: cover;
        background-position: center 30%;
        background-repeat: no-repeat;
        filter: blur(22px) brightness(0.42) saturate(1.1);
        transform: scale(1.12);
      }

      /* justify-content: center centra todo el contenido en vertical */
      .page {
        width: min(100%, 36rem);
        margin-inline: auto;
        padding: 1.75rem 1rem 2.75rem;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.25rem, 4.5vw, 2rem);
        animation: entrar 0.9s ease both;
      }

      @keyframes entrar {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Cambia el título en el h1 de más abajo, no aquí. */
      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 7vw, 2.55rem);
        font-weight: 400;
        letter-spacing: 0.06em;
        line-height: 1.2;
        text-align: center;
        color: #fff;
        text-shadow: 0 0.1rem 0.9rem rgba(0, 0, 0, 0.8);
      }

      /* REPRODUCTOR: el borde se pone rojo SOLO mientras el cursor está encima
         (o mientras lo tocas en el celular). Al sacar el cursor vuelve a normal. */
      .reproductor {
        width: 100%;
        background: rgba(10, 10, 10, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.28);
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.3s ease;
      }

      /* Pantallas con ratón (PC) */
      @media (hover: hover) {
        .reproductor:hover {
          border-color: var(--rojo);
          box-shadow:
            0 0 0 1px rgba(225, 29, 46, 0.55),
            0 0 1.6rem rgba(225, 29, 46, 0.45),
            0 0 3.5rem rgba(225, 29, 46, 0.2);
          transform: translateY(-2px);
        }
      }

      /* Celular: solo mientras lo tocas */
      .reproductor:active {
        border-color: var(--rojo);
        box-shadow:
          0 0 0 1px rgba(225, 29, 46, 0.55),
          0 0 1.6rem rgba(225, 29, 46, 0.45),
          0 0 3.5rem rgba(225, 29, 46, 0.2);
      }

      /* Video de YouTube en proporción 16:9 */
      .reproductor iframe {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        background: #000;
      }

      @media (min-width: 56.25em) {
        .page {
          width: min(100% - 2rem, 38rem);
          padding-block: 3.25rem 4rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page {
          animation: none;
        }
        .reproductor {
          transition: none;
        }
        .reproductor:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="fondo" aria-hidden="true"></div>
    <main class="page">
      <!-- Cambia el título aquí (usa &lt;3 si quieres el corazón <3). -->
      <h1>Te amo &lt;3</h1>

      <!-- VIDEO: para cambiarlo, reemplaza el ID UwWzqv-wlbw por el de otro video de YouTube. -->
      <div class="reproductor">
        <iframe
          id="yt"
          src="https://www.youtube.com/embed/UwWzqv-wlbw?enablejsapi=1&rel=0&playsinline=1"
          title="Esteban y Sel"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </main>

    <script>
      // ESTADÍSTICAS: eventos del video que se ven en Microsoft Clarity
      function registrarEvento(nombre) {
        if (typeof window.clarity === "function") {
          window.clarity("event", nombre);
        }
      }

      const hitos = new Set();
      let reproduciendo = false;
      let temporizador = null;
      let player = null;

      function revisarProgreso() {
        if (!player || !player.getDuration) return;
        const dur = player.getDuration();
        if (!dur) return;
        const pct = (player.getCurrentTime() / dur) * 100;
        for (const h of [25, 50, 75]) {
          if (pct >= h && !hitos.has(h)) {
            hitos.add(h);
            registrarEvento("video_" + h);
          }
        }
      }

      function alCambiarEstado(e) {
        // 1 = reproduciendo, 2 = pausa, 0 = terminó
        if (e.data === 1) {
          if (!reproduciendo) {
            reproduciendo = true;
            registrarEvento("video_play");
          }
          if (!temporizador) temporizador = setInterval(revisarProgreso, 1000);
        } else {
          if (temporizador) {
            clearInterval(temporizador);
            temporizador = null;
          }
          if (e.data === 0) {
            registrarEvento("video_completo");
            reproduciendo = false;
          }
        }
      }

      // API de YouTube (si falla, el video igual se ve y se reproduce)
      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("yt", {
          events: { onStateChange: alCambiarEstado },
        });
      };
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    </script>
  </body>
</html>
