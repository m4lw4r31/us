<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Te amo &lt;3</title>
    <style>
      :root {
        color-scheme: dark;
        --rojo: #e11d2e; /* Cambia este color si quieres otro tono de rojo */
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        background: #000;
      }

      body {
        margin: 0;
        background: transparent;
        color: #f4f4f4;
        font-family: Georgia, "Palatino Linotype", Palatino, "Times New Roman",
          serif;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      /* FONDO: la foto de los dos, borrosa y oscurecida.
         - Menos borroso: baja el 22px (por ejemplo 12px).
         - Más visible: sube el brightness de 0.42 a 0.6. */
      .fondo {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #000;
        background-image: url("./Selina%20y%20jose.webp");
        background-size: cover;
        background-position: center 30%;
        background-repeat: no-repeat;
        filter: blur(22px) brightness(0.42) saturate(1.1);
        transform: scale(1.12);
      }

      .page {
        width: min(100%, 36rem);
        margin-inline: auto;
        padding: 1.75rem 1rem 2.75rem;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 4.5vw, 2rem);
        animation: entrar 0.9s ease both;
      }

      @keyframes entrar {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Cambia el título en el h1 de más abajo, no aquí. */
      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 7vw, 2.55rem);
        font-weight: 400;
        letter-spacing: 0.06em;
        line-height: 1.2;
        text-align: center;
        color: #fff;
        text-shadow: 0 0.1rem 0.9rem rgba(0, 0, 0, 0.8);
      }

      .foto {
        margin: 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .foto img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        max-height: min(68dvh, 34rem);
        object-fit: contain;
        border: 1px solid rgba(255, 255, 255, 0.35);
        box-shadow:
          0 0.2rem 0.5rem rgba(0, 0, 0, 0.5),
          0 1.15rem 2.5rem rgba(0, 0, 0, 0.55);
      }

      /* REPRODUCTOR: borde normal, y rojo con resplandor al pasar el cursor,
         al tocarlo en el celular o mientras el video está sonando. */
      .reproductor {
        width: 100%;
        background: rgba(10, 10, 10, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.28);
        min-height: clamp(11rem, 42vw, 18rem);
        display: grid;
        place-items: center;
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.3s ease;
      }

      .reproductor:hover,
      .reproductor:focus-within,
      .reproductor:active,
      .reproductor.reproduciendo {
        border-color: var(--rojo);
        box-shadow:
          0 0 0 1px rgba(225, 29, 46, 0.55),
          0 0 1.6rem rgba(225, 29, 46, 0.45),
          0 0 3.5rem rgba(225, 29, 46, 0.2);
      }

      .reproductor:hover {
        transform: translateY(-2px);
      }

      .reproductor video {
        width: 100%;
        height: auto;
        max-height: min(62dvh, 28rem);
        object-fit: contain;
        background: #000;
        display: block;
      }

      @media (min-width: 56.25em) {
        .page {
          width: min(100% - 2rem, 38rem);
          padding-block: 3.25rem 4rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page {
          animation: none;
        }
        .reproductor {
          transition: none;
        }
        .reproductor:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="fondo" aria-hidden="true"></div>
    <main class="page">
      <!-- Cambia el título aquí (usa &lt;3 si quieres el corazón <3). -->
      <h1>Te amo &lt;3</h1>

      <figure class="foto">
        <img src="./foto.jpeg" alt="Foto" />
      </figure>

      <div class="reproductor">
        <video
          src="./video.mp4"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
        ></video>
      </div>
    </main>
    <script>
      const video = document.querySelector("video");
      const caja = document.querySelector(".reproductor");

      video.addEventListener("error", () => {
        video.removeAttribute("src");
        video.load();
      });

      // Mantiene el borde rojo mientras el video se reproduce
      video.addEventListener("play", () => caja.classList.add("reproduciendo"));
      video.addEventListener("pause", () =>
        caja.classList.remove("reproduciendo")
      );
      video.addEventListener("ended", () =>
        caja.classList.remove("reproduciendo")
      );
    </script>
  </body>
</html>
